<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ReelGrab – Video Downloader</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f1020;--card:#181a33;--line:#2a2d55;--text:#f1f0ff;--mute:#9a9cc4;--accent:#6c5cff;--mint:#3df0c0}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',system-ui,sans-serif;min-height:100vh;overflow-x:hidden}
h1,h2,.brand{font-family:'Bricolage Grotesque','DM Sans',sans-serif}
.glow{position:fixed;width:60vmax;height:60vmax;border-radius:50%;filter:blur(110px);opacity:.28;z-index:-1;animation:drift 18s ease-in-out infinite alternate}
.g1{background:var(--accent);top:-25vmax;left:-15vmax}.g2{background:var(--mint);bottom:-35vmax;right:-20vmax;animation-delay:-9s;opacity:.15}
@keyframes drift{to{transform:translate(8vmax,6vmax) scale(1.15)}}

/* ---------- custom splash loader: film strip + play button ---------- */
#splash{position:fixed;inset:0;background:var(--bg);z-index:99;display:grid;place-items:center;transition:opacity .6s,visibility .6s}
#splash.done{opacity:0;visibility:hidden}
.reel{width:200px;height:80px;overflow:hidden;position:relative;border-radius:10px;border:2px solid var(--line);background:#0b0c1a}
.strip{display:flex;gap:10px;position:absolute;left:0;top:10px;animation:roll 1s linear infinite}
.strip i{flex:0 0 52px;height:60px;border-radius:6px;background:linear-gradient(135deg,var(--accent),#3a2fb5)}
.strip i:nth-child(3n){background:linear-gradient(135deg,var(--mint),#1b8f76)}
@keyframes roll{to{transform:translateX(-62px)}}
.reel::before,.reel::after{content:"";position:absolute;top:0;bottom:0;width:40px;z-index:2}
.reel::before{left:0;background:linear-gradient(90deg,#0b0c1a,transparent)}.reel::after{right:0;background:linear-gradient(270deg,#0b0c1a,transparent)}
.playhead{position:absolute;inset:0;display:grid;place-items:center;z-index:3}
.playhead b{width:0;height:0;border-left:22px solid #fff;border-top:14px solid transparent;border-bottom:14px solid transparent;animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.25);opacity:.7}}
.bar{width:200px;height:4px;background:var(--line);border-radius:4px;margin:22px auto 10px;overflow:hidden}
.bar span{display:block;height:100%;width:0;background:var(--mint);animation:fill 1.6s ease-out forwards}
@keyframes fill{to{width:100%}}
.splash-txt{text-align:center;color:var(--mute);font-size:14px}

/* ---------- layout ---------- */
header{display:flex;justify-content:space-between;align-items:center;padding:22px 6vw}
.brand{font-weight:800;font-size:24px;letter-spacing:-.5px}.brand em{font-style:normal;color:var(--mint)}
nav span{color:var(--mute);font-size:14px}
main{max-width:820px;margin:0 auto;padding:6vh 20px 60px;text-align:center}
h1{font-size:clamp(36px,7vw,64px);line-height:1.02;font-weight:800;letter-spacing:-1.5px}
.sub{color:var(--mute);margin:16px auto 34px;max-width:520px;line-height:1.55}
.box{display:flex;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:10px;transition:box-shadow .3s,border-color .3s}
.box:focus-within{border-color:var(--accent);box-shadow:0 0 0 4px rgba(108,92,255,.22)}
.box input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--text);font:inherit;font-size:16px;padding:12px 14px}
.btn{border:0;border-radius:12px;padding:13px 24px;font:inherit;font-weight:500;font-size:16px;color:#fff;background:var(--accent);cursor:pointer;transition:transform .15s,background .2s}
.btn:hover{background:#7d6fff;transform:translateY(-2px)}.btn:active{transform:scale(.97)}.btn:disabled{opacity:.6;cursor:wait;transform:none}
.btn.mint{background:var(--mint);color:#07261e;font-weight:500}.btn.mint:hover{background:#6af5d3}
.err{color:#ff8a9b;margin-top:16px;min-height:22px}
.spin{display:inline-block;width:14px;height:14px;border:2px solid #fff6;border-top-color:#fff;border-radius:50%;animation:rot .7s linear infinite;vertical-align:-2px;margin-right:8px}
@keyframes rot{to{transform:rotate(360deg)}}

/* result card: opens in response to the Fetch action */
.result{display:none;margin-top:26px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px;text-align:left;gap:20px;grid-template-columns:240px 1fr}
.result.show{display:grid;animation:pop .45s cubic-bezier(.2,.9,.3,1.2)}
@keyframes pop{from{opacity:0;transform:translateY(18px) scale(.96)}}
.thumb{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:12px;background:#0b0c1a}
.result h2{font-size:20px;line-height:1.25;margin-bottom:6px}.dur{color:var(--mute);font-size:14px;margin-bottom:16px}
.row{display:flex;gap:10px;flex-wrap:wrap}
select{background:#0b0c1a;color:var(--text);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font:inherit}
.prog{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin-top:16px;display:none}
.prog span{display:block;height:100%;width:40%;background:linear-gradient(90deg,var(--accent),var(--mint));animation:slide 1.1s ease-in-out infinite}
@keyframes slide{0%{margin-left:-40%}100%{margin-left:100%}}
.note{margin-top:40px;color:var(--mute);font-size:13px;line-height:1.6}
@media(max-width:640px){.box{flex-direction:column}.result{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important}}
</style>
</head>
<body>
<div class="glow g1"></div><div class="glow g2"></div>

<div id="splash">
  <div>
    <div class="reel"><div class="strip"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div><div class="playhead"><b></b></div></div>
    <div class="bar"><span></span></div>
    <div class="splash-txt">Loading ReelGrab</div>
  </div>
</div>

<header><div class="brand">Reel<em>Grab</em></div><nav><span>Video &amp; audio downloader</span></nav></header>

<main>
  <h1>Paste a link.<br>Get the file.</h1>
  <p class="sub">Works with any page that has a video. Pick the quality, then download.</p>

  <div class="box">
    <input id="url" type="url" placeholder="https://example.com/watch?v=..." autocomplete="off">
    <button class="btn" id="fetchBtn">Fetch video</button>
  </div>
  <div class="err" id="err"></div>

  <section class="result" id="result">
    <img class="thumb" id="thumb" alt="">
    <div>
      <h2 id="title"></h2>
      <div class="dur" id="dur"></div>
      <div class="row">
        <select id="quality"></select>
        <button class="btn mint" id="dlVideo">Download video</button>
        <button class="btn" id="dlAudio">Download MP3</button>
      </div>
      <div class="prog" id="prog"><span></span></div>
    </div>
  </section>

  <p class="note">Only download content you own, content that is licensed for download, or that you have permission to save.</p>
</main>

<script>
const API = ""; // same origin as the Flask server
const $ = id => document.getElementById(id);
let current = "";

addEventListener("load", () => setTimeout(() => $("splash").classList.add("done"), 1700));

function fmt(s){ if(!s) return ""; const m=Math.floor(s/60), r=Math.floor(s%60); return m+":"+String(r).padStart(2,"0"); }

async function api(path, body){
  const res = await fetch(API + path, {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body)});
  if(!res.ok){ let m="Something went wrong. Try again."; try{ m=(await res.json()).error||m }catch(e){} throw new Error(m); }
  return res;
}

$("fetchBtn").onclick = async () => {
  const url = $("url").value.trim();
  $("err").textContent = "";
  if(!url){ $("err").textContent = "Paste a video link first."; return; }
  const b = $("fetchBtn"); b.disabled = true; b.innerHTML = '<span class="spin"></span>Fetching';
  $("result").classList.remove("show");
  try{
    const d = await (await api("/api/info", {url})).json();
    current = url;
    $("thumb").src = d.thumbnail || ""; $("title").textContent = d.title || "Untitled";
    $("dur").textContent = fmt(d.duration);
    const q = $("quality"); q.innerHTML = "";
    (d.heights.length ? d.heights : [0]).forEach((h,i) => {
      const o = document.createElement("option"); o.value = h; o.textContent = h ? h + "p" + (i===0 ? " (best)" : "") : "Best available"; q.appendChild(o);
    });
    void $("result").offsetWidth; $("result").classList.add("show");
  }catch(e){ $("err").textContent = e.message; }
  b.disabled = false; b.textContent = "Fetch video";
};
$("url").addEventListener("keydown", e => { if(e.key==="Enter") $("fetchBtn").click(); });

async function download(kind){
  const btns = [$("dlVideo"), $("dlAudio")]; btns.forEach(b => b.disabled = true);
  $("prog").style.display = "block"; $("err").textContent = "";
  try{
    const res = await api("/api/download", {url: current, kind, height: Number($("quality").value) || null});
    const cd = res.headers.get("Content-Disposition") || "";
    const m = /filename\*?=(?:UTF-8'')?"?([^";]+)"?/i.exec(cd);
    const name = m ? decodeURIComponent(m[1]) : (kind==="audio" ? "audio.mp3" : "video.mp4");
    const blob = await res.blob(), a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 10000);
  }catch(e){ $("err").textContent = e.message; }
  $("prog").style.display = "none"; btns.forEach(b => b.disabled = false);
}
$("dlVideo").onclick = () => download("video");
$("dlAudio").onclick = () => download("audio");
</script>
</body>
</html>
